<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e1f1f"/>
      <stop offset="1" stop-color="#2b2118"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <!-- 棋盘 -->
  <g stroke="#e8c877" stroke-width="3" opacity="0.95">
    <rect x="34" y="34" width="124" height="124" rx="6" fill="none"/>
    <line x1="75.3" y1="34" x2="75.3" y2="158"/>
    <line x1="116.7" y1="34" x2="116.7" y2="158"/>
    <line x1="34" y1="75.3" x2="158" y2="75.3"/>
    <line x1="34" y1="116.7" x2="158" y2="116.7"/>
  </g>
  <!-- 棋子：将（红）与 兵（金） -->
  <circle cx="75" cy="75" r="21" fill="#c0392b" stroke="#f5e6c8" stroke-width="3"/>
  <text x="75" y="83" font-size="24" font-family="Microsoft YaHei, sans-serif"
        font-weight="bold" fill="#f5e6c8" text-anchor="middle">将</text>
  <circle cx="116" cy="116" r="17" fill="#b8860b" stroke="#f5e6c8" stroke-width="3"/>
  <text x="116" y="123" font-size="19" font-family="Microsoft YaHei, sans-serif"
        font-weight="bold" fill="#fff8e7" text-anchor="middle">兵</text>
  <!-- 剑 -->
  <g transform="translate(96 168)" opacity="0.9">
    <rect x="-30" y="-2.5" width="60" height="5" rx="2.5" fill="#e8c877"/>
    <rect x="-4" y="-9" width="8" height="18" rx="3" fill="#8e1f1f" stroke="#e8c877" stroke-width="2"/>
  </g>
</svg>
