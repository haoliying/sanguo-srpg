<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="三国战棋 —— 还原三国演义著名战役的回合制战棋游戏，100 关由易到难">
<title>三国战棋</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div id="app">

  <!-- 首页 -->
  <section id="page-home" class="page"></section>

  <!-- 关卡选择 -->
  <section id="page-levels" class="page"></section>

  <!-- 编队 -->
  <section id="page-party" class="page"></section>

  <!-- 战斗：整屏留给沙场，其余界面都是可收起的浮层 -->
  <section id="page-battle" class="page">
    <div class="bt-board-wrap">
      <canvas id="bt-canvas"></canvas>
    </div>

    <!-- 顶部状态条：细窄一条，可一键收起 -->
    <header class="bt-top" id="bt-top">
      <button class="icon-btn" id="bt-back" title="撤退">←</button>
      <div class="bt-title">
        <div class="bt-name" id="bt-name">—</div>
        <div class="bt-sub" id="bt-sub"></div>
      </div>
      <button class="bt-weather" id="bt-weather" title="天时"></button>
      <button class="icon-btn" id="bt-collapse" title="收起界面">⤡</button>
    </header>

    <!-- 右侧悬浮操作栏：缩放、全军一览、结束回合 -->
    <div class="bt-rail" id="bt-dock">
      <button class="dock-btn" data-act="roster" title="全军一览">⚔</button>
      <button class="dock-btn" data-act="endturn" title="结束回合">回合▸</button>
      <div class="bt-zoom" id="bt-zoom">
        <button class="zoom-btn" data-act="zoomin" title="放大">＋</button>
        <button class="zoom-btn" data-act="zoomout" title="缩小">－</button>
        <button class="zoom-btn" data-act="zoomfit" title="全图">⛶</button>
        <button class="zoom-btn" data-act="zoomreset" title="复位">⊙</button>
      </div>
    </div>

    <!-- 部队一览：默认收在屏幕左侧 -->
    <div class="bt-roster" id="bt-roster"></div>

    <!-- 单位卡与行动按钮：点中单位才从底部升起 -->
    <div class="bt-sheet" id="bt-sheet">
      <button class="sheet-grip" id="bt-grip" title="收起面板">▾</button>
      <div class="bt-card" id="bt-card"></div>
      <div class="bt-actions" id="bt-actions">
        <button class="btn btn-primary" id="bt-skill" data-act="skill">武将技</button>
        <button class="btn btn-ghost" id="bt-wait" data-act="wait">待命</button>
        <button class="btn btn-ghost" id="bt-cancel" data-act="cancel">取消</button>
      </div>
    </div>
  </section>

  <!-- 结算 -->
  <section id="page-result" class="page"></section>

  <!-- 武将 -->
  <section id="page-heroes" class="page"></section>

  <!-- 设置 -->
  <section id="page-settings" class="page"></section>

</div>

<div id="toast" class="toast"></div>

<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/game.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/battle.js"></script>
<script src="assets/js/app.js"></script>
<script>
  (function () {
    SG.app.boot();
  })();
</script>
</body>
</html>
